name: ReportediOS
options:
  bundleIdPrefix: com.reported
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.12.1
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2
  LiteRTLM:
    path: Packages/LiteRTLMSafe
targets:
  ReportediOS:
    type: application
    platform: iOS
    sources:
      - path: ReportediOS/Sources
      - path: ReportediOS/Resources
    info:
      path: ReportediOS/Generated/Info.plist
      properties:
        CFBundleDisplayName: Reported
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: 131272311428-4jjr2un9bb6stj1pbvpd9a73qnp64hvh.apps.googleusercontent.com
        NSPhotoLibraryUsageDescription: Reported uses your photo library to attach report media, read photo time and location metadata, and run optional on-device infraction detection.
        NSPhotoLibraryAddUsageDescription: Reported may save temporary report media generated while preparing a submission.
        NSMicrophoneUsageDescription: Reported uses the microphone when you choose to talk through report fields.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.reported.reported
            CFBundleURLSchemes:
              - reported
          - CFBundleURLName: Google Sign-In
            CFBundleURLSchemes:
              - com.googleusercontent.apps.131272311428-4jjr2un9bb6stj1pbvpd9a73qnp64hvh
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: ReportediOS/Resources/ReportediOS.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.reported.reported
        com.apple.security.application-groups:
          - group.cab.reported.nyc
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reported.reported
        PRODUCT_NAME: ReportediOS
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5GB9SD339W
        MARKETING_VERSION: 3.1.8
        CURRENT_PROJECT_VERSION: 62
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    dependencies:
      - framework: ../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/SharedCore.framework
        embed: true
        codeSign: true
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseFirestore
      - package: Lottie
        product: Lottie
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: onnxruntime
        product: onnxruntime
      - package: LiteRTLM
        product: LiteRTLM
      - target: ReportedShareExtension
        embed: true
    preBuildScripts:
      - name: Verify UDF Architecture
        script: |
          VIOLATIONS=$(grep -R -n -E --include='*.swift' 'class[[:space:]]+[A-Za-z0-9_]+ViewModel.*ObservableObject' "$SRCROOT/ReportediOS/Sources" | grep -v 'UdfStore' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "Every ViewModel must conform to UdfStore:"
            echo "$VIOLATIONS"
            exit 1
          fi
      - name: Build SharedCore
        outputFiles:
          - $(DERIVED_FILE_DIR)/SharedCoreBuild.stamp
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home)
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon
          touch "${DERIVED_FILE_DIR}/SharedCoreBuild.stamp"
    postBuildScripts:
      - name: Configure Parse
        script: /usr/bin/python3 "$SRCROOT/scripts/write-parse-config.py"
        basedOnDependencyAnalysis: false
      - name: Normalize Embedded Framework Minimum OS
        outputFiles:
          - $(DERIVED_FILE_DIR)/NormalizeOnnxMinimumOS.stamp
        script: |
          ONNX_FRAMEWORK="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
          ONNX_PLIST="${ONNX_FRAMEWORK}/Info.plist"
          if [ -f "$ONNX_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion ${IPHONEOS_DEPLOYMENT_TARGET}" "$ONNX_PLIST" || \
              /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string ${IPHONEOS_DEPLOYMENT_TARGET}" "$ONNX_PLIST"
            if [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none --generate-entitlement-der "$ONNX_FRAMEWORK"
            fi
          fi
          touch "${DERIVED_FILE_DIR}/NormalizeOnnxMinimumOS.stamp"
  ReportedShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ReportedShareExtension/Sources
      - path: ReportedShareExtension/Resources
    info:
      path: ReportedShareExtension/Generated/Info.plist
      properties:
        CFBundleDisplayName: Reported
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    entitlements:
      path: ReportedShareExtension/Resources/ReportedShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cab.reported.nyc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reported.reported.shareextension
        PRODUCT_NAME: ReportedShareExtension
        SWIFT_VERSION: "5.10"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5GB9SD339W
        MARKETING_VERSION: 3.1.8
        CURRENT_PROJECT_VERSION: 62
