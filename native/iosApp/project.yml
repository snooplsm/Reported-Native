name: ReportediOS
options:
  bundleIdPrefix: com.reported
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.12.1
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2
targets:
  ReportediOS:
    type: application
    platform: iOS
    sources:
      - path: ReportediOS/Sources
      - path: ReportediOS/Resources
    info:
      path: ReportediOS/Generated/Info.plist
      properties:
        CFBundleDisplayName: Reported Native
        CFBundleURLTypes:
          - CFBundleURLName: cab.reported.nyc
            CFBundleURLSchemes:
              - reported
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: ReportediOS/Resources/ReportediOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cab.reported.nyc
        PRODUCT_NAME: ReportediOS
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    dependencies:
      - framework: ../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/SharedCore.framework
        embed: true
        codeSign: true
      - package: Firebase
        product: FirebaseAnalytics
      - package: onnxruntime
        product: onnxruntime
      - target: ReportedShareExtension
        embed: true
    preBuildScripts:
      - name: Build SharedCore
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home)
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  ReportedShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ReportedShareExtension/Sources
      - path: ReportedShareExtension/Resources
    info:
      path: ReportedShareExtension/Generated/Info.plist
      properties:
        CFBundleDisplayName: Reported
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    entitlements:
      path: ReportedShareExtension/Resources/ReportedShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cab.reported.nyc.shareextension
        PRODUCT_NAME: ReportedShareExtension
        SWIFT_VERSION: "5.10"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
